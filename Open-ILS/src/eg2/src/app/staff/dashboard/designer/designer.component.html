<eg-staff-banner bannerText="Dashboard Designer" i18n-bannerText>
</eg-staff-banner>

<div class="container-fluid dashboard-designer">

  <!-- Configuration Form -->
  <div class="row mb-4">
    <div class="col-12">
      <h3 class="mb-3" i18n>Widget Configuration</h3>
      <form class="form-validated common-form striped-odd" role="form">

          <!-- Widget Type Selection -->
          <div class="form-group row">
            <label for="widgetType" class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Widget Type</label>
            <div class="col-lg-9">
              <select class="form-select" id="widgetType"
                      [(ngModel)]="selectedWidgetType"
                      (change)="onWidgetTypeChange($event)"
                      name="widgetType">
                <option value="circulations" i18n>Circulations</option>
                <option value="acquisitions" i18n>Acquisitions</option>
                <option value="cataloging" i18n>Cataloging</option>
                <option value="patrons" i18n>Patrons</option>
                <option value="holdings" i18n>Holdings</option>
              </select>
            </div>
          </div>

          <!-- Chart Type Selection -->
          <div class="form-group row">
            <label for="chartType" class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Chart Type</label>
            <div class="col-lg-9">
              <select class="form-select" id="chartType" name="chartType">
                <option value="line" i18n>Line Chart</option>
                <option value="bar" i18n>Bar Chart</option>
                <option value="pie" i18n>Pie Chart</option>
                <option value="metric" i18n>Metric Card</option>
              </select>
            </div>
          </div>

          <!-- Time Range Selection -->
          <div class="form-group row">
            <label for="timeRange" class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Time Range</label>
            <div class="col-lg-9">
              <select class="form-select" id="timeRange" name="timeRange">
                <option value="week" i18n>Last Week</option>
                <option value="month" i18n>Last Month</option>
                <option value="quarter" i18n>Last Quarter</option>
                <option value="year" i18n>Last Year</option>
                <option value="custom" i18n>Custom Range</option>
              </select>
            </div>
          </div>

          <!-- Chart Title -->
          <div class="form-group row">
            <label for="chartTitle" class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Chart Title</label>
            <div class="col-lg-9">
              <input type="text" class="form-control" id="chartTitle" name="chartTitle" placeholder="Enter chart title" value="Title Here">
            </div>
          </div>

          <!-- Applied Filters -->
          <div class="form-group row" *ngIf="appliedFilters.length > 0">
            <label class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Applied Filters</label>
            <div class="col-lg-9">
              <div class="filter-entries">
                <div class="row py-2 ps-1 align-items-start" *ngFor="let filter of appliedFilters">
                  <div class="col-10">{{ filter.label }}</div>
                  <div class="col-2 pe-0 text-end">
                    <button class="btn btn-sm btn-outline-dark"
                            (click)="removeFilter(filter.filterId)"
                            i18n-aria-label
                            [attr.aria-label]="'Remove ' + filter.label + ' filter'"
                            i18n-title
                            [attr.title]="'Remove ' + filter.label + ' filter'">
                      <span class="material-icons mat-icon-in-button" aria-hidden="true">close</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Add Filter Section -->
          <div class="form-group row">
            <label class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Add Filter</label>
            <div class="col-lg-9">
              <button class="btn btn-outline-primary label-with-material-icon"
                      type="button"
                      (click)="toggleFilterOptions()"
                      [disabled]="!selectedWidgetType">
                <span class="material-icons" aria-hidden="true">add</span>
                <span i18n>Add Filter</span>
                <span class="material-icons ms-1" aria-hidden="true">
                  {{ showFilterOptions ? 'expand_less' : 'expand_more' }}
                </span>
              </button>

              <!-- Available Filter Options -->
              <div class="filter-options-list mt-2" *ngIf="showFilterOptions">
                <div class="filter-option-buttons">
                  <button *ngFor="let filterOption of availableFilters"
                          class="btn btn-outline-secondary btn-sm me-2 mb-1"
                          type="button"
                          (click)="selectFilterToAdd(filterOption)"
                          [disabled]="isFilterApplied(filterOption.id)">
                    {{ filterOption.label }}
                  </button>
                  <div class="text-muted small mt-2" *ngIf="availableFilters.length === 0">
                    No filters available for this widget type.
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Filter Configuration -->
          <div class="form-group row" *ngIf="selectedFilterToAdd">
            <label class="form-label col-form-label col-lg-3 text-end fw-bold">Configure {{ selectedFilterToAdd.label }}</label>
            <div class="col-lg-9">
              <div class="filter-config-form">

                <!-- Multi-select filter -->
                <div *ngIf="selectedFilterToAdd.type === 'multiselect'">
                  <div class="form-check-grid">
                    <div class="form-check" *ngFor="let option of selectedFilterToAdd.options">
                      <input class="form-check-input"
                             type="checkbox"
                             [id]="'filter_' + selectedFilterToAdd.id + '_' + option.value"
                             [value]="option.value"
                             (change)="updateFilterValue($event, option.value)">
                      <label class="form-check-label"
                             [for]="'filter_' + selectedFilterToAdd.id + '_' + option.value">
                        {{ option.label }}
                      </label>
                    </div>
                  </div>
                </div>

                <!-- Single select filter -->
                <div *ngIf="selectedFilterToAdd.type === 'select'">
                  <select class="form-select"
                          (change)="updateFilterValue($event, $event.target.value)">
                    <option value="">Select {{ selectedFilterToAdd.label }}</option>
                    <option *ngFor="let option of selectedFilterToAdd.options"
                            [value]="option.value">
                      {{ option.label }}
                    </option>
                  </select>
                </div>

                <!-- Text filter -->
                <div *ngIf="selectedFilterToAdd.type === 'text'">
                  <input type="text"
                         class="form-control"
                         [placeholder]="selectedFilterToAdd.placeholder || 'Enter value'"
                         (input)="updateFilterValue($event, $event.target.value)">
                </div>

                <!-- Number range filter -->
                <div *ngIf="selectedFilterToAdd.type === 'numberrange'" class="row">
                  <div class="col-md-6">
                    <label class="form-label" i18n>Minimum</label>
                    <input type="number"
                           class="form-control"
                           placeholder="Min"
                           (input)="updateFilterRangeValue('min', $event.target.value)">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" i18n>Maximum</label>
                    <input type="number"
                           class="form-control"
                           placeholder="Max"
                           (input)="updateFilterRangeValue('max', $event.target.value)">
                  </div>
                </div>

                <!-- Date range filter -->
                <div *ngIf="selectedFilterToAdd.type === 'daterange'" class="row">
                  <div class="col-md-6">
                    <label class="form-label" i18n>Start Date</label>
                    <input type="date"
                           class="form-control"
                           (change)="updateFilterRangeValue('start', $event.target.value)">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" i18n>End Date</label>
                    <input type="date"
                           class="form-control"
                           (change)="updateFilterRangeValue('end', $event.target.value)">
                  </div>
                </div>

                <div class="mt-3">
                  <button type="button"
                          class="btn btn-success me-2"
                          (click)="applyFilter()"
                          [disabled]="!isFilterConfigValid()"
                          i18n>
                    Apply Filter
                  </button>
                  <button type="button"
                          class="btn btn-secondary"
                          (click)="cancelFilterConfig()"
                          i18n>
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Color Theme Selection -->
          <div class="form-group row">
            <label class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Color Theme</label>
            <div class="col-lg-9">
              <select class="form-select" id="colorTheme" name="colorTheme">
                <option value="primary" i18n>Blue (Primary)</option>
                <option value="success" i18n>Green (Success)</option>
                <option value="danger" i18n>Red (Danger)</option>
                <option value="warning" i18n>Yellow (Warning)</option>
                <option value="info" i18n>Cyan (Info)</option>
                <option value="secondary" i18n>Gray (Secondary)</option>
                <option value="dark" i18n>Dark</option>
                <option value="custom" i18n>Custom Colors</option>
              </select>
            </div>
          </div>

          <!-- Display Options -->
          <div class="form-group row">
            <label class="form-label col-form-label col-lg-3 text-end fw-bold" i18n>Display Options</label>
            <div class="col-lg-9">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="showLegend" name="showLegend" checked>
                <label class="form-check-label" for="showLegend" i18n>
                  Show Legend
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="showGrid" name="showGrid" checked>
                <label class="form-check-label" for="showGrid" i18n>
                  Show Grid Lines
                </label>
              </div>
            </div>
          </div>

      </form>
    </div>
  </div>

  <!-- Full-Width Chart Preview -->
  <div class="row">
    <div class="col-12">
      <div class="chart-canvas">
        <div class="chart-preview">
          <h3 class="chart-title">Title Here</h3>

          <!-- Mock Chart Container -->
          <div class="mock-chart">
            <svg viewBox="0 0 600 300" class="chart-svg">
              <!-- Y-axis -->
              <line x1="40" y1="20" x2="40" y2="280" stroke="#ccc" stroke-width="1"/>

              <!-- X-axis -->
              <line x1="40" y1="280" x2="580" y2="280" stroke="#ccc" stroke-width="1"/>

              <!-- Y-axis labels -->
              <text x="35" y="25" text-anchor="end" class="axis-label">160</text>
              <text x="35" y="65" text-anchor="end" class="axis-label">150</text>
              <text x="35" y="105" text-anchor="end" class="axis-label">140</text>
              <text x="35" y="145" text-anchor="end" class="axis-label">130</text>
              <text x="35" y="185" text-anchor="end" class="axis-label">120</text>
              <text x="35" y="225" text-anchor="end" class="axis-label">110</text>
              <text x="35" y="265" text-anchor="end" class="axis-label">100</text>

              <!-- Grid lines -->
              <line x1="40" y1="60" x2="580" y2="60" stroke="#f0f0f0" stroke-width="0.5"/>
              <line x1="40" y1="100" x2="580" y2="100" stroke="#f0f0f0" stroke-width="0.5"/>
              <line x1="40" y1="140" x2="580" y2="140" stroke="#f0f0f0" stroke-width="0.5"/>
              <line x1="40" y1="180" x2="580" y2="180" stroke="#f0f0f0" stroke-width="0.5"/>
              <line x1="40" y1="220" x2="580" y2="220" stroke="#f0f0f0" stroke-width="0.5"/>

              <!-- Sample line chart data -->
              <polyline points="60,240 100,160 140,180 180,140 220,120 260,100 300,160 340,80 380,120 420,60 460,140 500,120 540,40"
                        fill="none" stroke="#007bff" stroke-width="2"/>

              <!-- Data points -->
              <circle cx="60" cy="240" r="3" fill="#007bff"/>
              <circle cx="100" cy="160" r="3" fill="#007bff"/>
              <circle cx="140" cy="180" r="3" fill="#007bff"/>
              <circle cx="180" cy="140" r="3" fill="#007bff"/>
              <circle cx="220" cy="120" r="3" fill="#007bff"/>
              <circle cx="260" cy="100" r="3" fill="#007bff"/>
              <circle cx="300" cy="160" r="3" fill="#007bff"/>
              <circle cx="340" cy="80" r="3" fill="#007bff"/>
              <circle cx="380" cy="120" r="3" fill="#007bff"/>
              <circle cx="420" cy="60" r="3" fill="#007bff"/>
              <circle cx="460" cy="140" r="3" fill="#007bff"/>
              <circle cx="500" cy="120" r="3" fill="#007bff"/>
              <circle cx="540" cy="40" r="3" fill="#007bff"/>

              <!-- X-axis labels -->
              <text x="60" y="295" text-anchor="middle" class="axis-label">Jan</text>
              <text x="140" y="295" text-anchor="middle" class="axis-label">Feb</text>
              <text x="220" y="295" text-anchor="middle" class="axis-label">Mar</text>
              <text x="300" y="295" text-anchor="middle" class="axis-label">Apr</text>
              <text x="380" y="295" text-anchor="middle" class="axis-label">May</text>
              <text x="460" y="295" text-anchor="middle" class="axis-label">Jun</text>
              <text x="540" y="295" text-anchor="middle" class="axis-label">Jul</text>
            </svg>
          </div>

          <!-- Chart Legend -->
          <div class="chart-legend">
            <div class="legend-item">
              <span class="legend-color" style="background-color: #007bff;"></span>
              <span class="legend-label">Circulation Data</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
