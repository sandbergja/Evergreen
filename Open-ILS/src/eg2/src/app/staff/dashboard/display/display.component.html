<div class="container-fluid">

  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">
          <span class="material-icons me-2" aria-hidden="true">dashboard</span>
          Library Dashboard
        </h1>
<!--        <button-->
<!--          type="button"-->
<!--          class="btn btn-outline-primary"-->
<!--          (click)="refreshData()"-->
<!--          [disabled]="loading"-->
<!--          aria-label="Refresh dashboard data">-->
<!--          <span class="material-icons me-1" aria-hidden="true">refresh</span>-->
<!--          Refresh-->
<!--        </button>-->
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="row">
    <div class="col-12 text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading dashboard...</span>
      </div>
      <p class="mt-2 text-muted">Loading dashboard data...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="row">
    <div class="col-12">
      <div class="alert alert-danger d-flex align-items-center" role="alert">
        <span class="material-icons me-2" aria-hidden="true">error</span>
        <div>
          <strong>Error:</strong> {{ error }}
          <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="refreshData()">
            Try Again
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!loading && !error">

    <!-- Widget Section -->
    <div class="row mb-4" *ngIf="showWidgetSection">
      <div class="col-12">
<!--        <div class="card">-->
<!--          <div class="card-header">-->
<!--            <h5 class="card-title mb-0">-->
<!--              <span class="material-icons me-2" aria-hidden="true">widgets</span>-->
<!--              Dashboard Widgets-->
<!--            </h5>-->
<!--          </div>-->
<!--          <div class="card-body">-->

            <!-- Monthly Circulation by Shelving Location Widget -->
            <div class="row" *ngIf="monthlyCirculationWidget">
              <div class="col-lg-12 mb-4">
                <eg-monthly-circulation-by-location-chart-widget
                  [config]="monthlyCirculationWidget"
                  (dataLoaded)="onWidgetDataLoaded($event)"
                  (dataError)="onWidgetError($event)"
                  (configChanged)="onWidgetConfigChanged($event)">
                </eg-monthly-circulation-by-location-chart-widget>
              </div>
            </div>

            <!-- Current Holds Metric Widget -->
            <div class="row" *ngIf="currentHoldsMetricWidget">
              <div class="col-lg-6 mb-4">
                <eg-current-holds-metric-widget
                  [config]="currentHoldsMetricWidget"
                  (dataLoaded)="onWidgetDataLoaded($event)"
                  (dataError)="onWidgetError($event)"
                  (configChanged)="onWidgetConfigChanged($event)">
                </eg-current-holds-metric-widget>
              </div>
            </div>

            <!-- JSON Chart Widget Example -->
            <div class="row" *ngIf="jsonChartWidget">
              <div class="col-lg-12 mb-4">
                <div class="json-widget-demo">
                  <eg-json-widget
                    [config]="jsonChartWidget"
                    [showHeader]="true"
                    [showDebugInfo]="false">
                  </eg-json-widget>
                </div>
              </div>
            </div>

<!--          </div>-->
<!--        </div>-->
      </div>
    </div>

  </div>
</div>
