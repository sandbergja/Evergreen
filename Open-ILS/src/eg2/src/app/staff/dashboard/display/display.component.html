<div class="container-fluid">

  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">
          <span class="material-icons me-2" aria-hidden="true">dashboard</span>
          Library Dashboard
        </h1>
        <button
          type="button"
          class="btn btn-outline-primary"
          (click)="refreshData()"
          [disabled]="loading"
          aria-label="Refresh dashboard data">
          <span class="material-icons me-1" aria-hidden="true">refresh</span>
          Refresh
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="row">
    <div class="col-12 text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading dashboard...</span>
      </div>
      <p class="mt-2 text-muted">Loading dashboard data...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="row">
    <div class="col-12">
      <div class="alert alert-danger d-flex align-items-center" role="alert">
        <span class="material-icons me-2" aria-hidden="true">error</span>
        <div>
          <strong>Error:</strong> {{ error }}
          <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="refreshData()">
            Try Again
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Content - Database-Driven Widgets -->
  <div *ngIf="!loading && !error">

    <!-- Dynamic Widgets Grid -->
    <div *ngIf="widgets && widgets.length > 0" class="row g-4">
      <div *ngFor="let widget of widgets" class="col-12 col-md-6 col-lg-4">
        <div class="widget-container h-100">
          <eg-json-widget
            [config]="widget"
            [showHeader]="true"
            [showDebugInfo]="false">
          </eg-json-widget>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!widgets || widgets.length === 0" class="row">
      <div class="col-12 text-center py-5">
        <span class="material-icons" style="font-size: 64px; color: #ccc;" aria-hidden="true">dashboard_customize</span>
        <h3 class="mt-3">No Widgets Configured</h3>
        <p class="text-muted">
          Your dashboard is currently empty. Contact your administrator to enable dashboard widgets.
        </p>
      </div>
    </div>

  </div>

</div>
