<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2">
          <span class="material-icons me-2" aria-hidden="true">dashboard</span>
          Library Dashboard
        </h1>
        <button
          type="button"
          class="btn btn-outline-primary"
          (click)="refreshData()"
          [disabled]="loading"
          aria-label="Refresh dashboard data">
          <span class="material-icons me-1" aria-hidden="true">refresh</span>
          Refresh
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="row">
    <div class="col-12 text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading dashboard...</span>
      </div>
      <p class="mt-2 text-muted">Loading dashboard data...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="row">
    <div class="col-12">
      <div class="alert alert-danger d-flex align-items-center" role="alert">
        <span class="material-icons me-2" aria-hidden="true">error</span>
        <div>
          <strong>Error:</strong> {{ error }}
          <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="refreshData()">
            Try Again
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!loading && !error">

    <div class="card">
      <div class="card-body">
        <eg-chart
          *ngIf="circulationTrendData"
          [type]="'line'"
          [chartData]="circulationTrendData"
          [config]="circulationChartConfig"
          [allowChartTypeToggle]="true"
          [supportedChartTypes]="['line', 'bar']"
          (chartTypeChanged)="onCirculationChartTypeChanged($event)"
          (error)="onChartError($event)">
        </eg-chart>
      </div> 
    </div>

    <div class="card chart-card">
      <div class="card-body">
        <eg-chart
          [type]="'line'"
          [chartData]="circByDayData"
          [config]="circByDayChartConfig"
          (error)="onChartError($event)">
        </eg-chart>
      </div>
    </div>
    <div class="card chart-card">
        <div class="card-header">
          <h5 class="card-title mb-0">
            <span class="material-icons me-2" aria-hidden="true">pie_chart</span>
            Collection Breakdown
          </h5>
        </div>
        <div class="card-body">
          <eg-chart
            [type]="'pie'"
            [chartData]="collectionByStatusData"
            [config]="collectionChartConfig"
            (error)="onChartError($event)">
          </eg-chart>
        </div>
      </div>
    </div>    
</div>
